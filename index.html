    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
            touch-action: pan-y;
        }
        
        /* 3D Flip Card Styles */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 { transform: rotateY(180deg); }
        .card-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Category Badges */
        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .badge-rei { background-color: #dbeafe; color: #1e40af; }
        .badge-kaki { background-color: #dcfce7; color: #166534; }
        .badge-ana { background-color: #fef9c3; color: #854d0e; }
        .badge-nara { background-color: #f3e8ff; color: #6b21a8; }
        .badge-ei { background-color: #ffedd5; color: #9a3412; }
        .badge-wa { background-color: #fce7f3; color: #9d174d; }
        .badge-mondai { background-color: #e0e7ff; color: #3730a3; }
        .badge-default { background-color: #f3f4f6; color: #374151; }
        .badge-4taku { background-color: #cffafe; color: #155e75; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .no-select {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>

            { front: "【Lesson 13 - CHALLENGE! 2】次の日本語を英語に直しなさい。ただし、不定詞を使うこと。\n私にはそのDVDを見ている時間がありません。", back: "I have no time to watch the DVD. / I don't have time to watch the DVD.", hint: "Lesson 13: 不定詞①" },

            { front: "【Lesson 14 - 1-2】( )内から適切なほうを選びなさい。\nThe charm seems to (have come / come) off the keychain again.", back: "have come", hint: "Lesson 15: 不定詞③" },

        // ================= Workbook 追加データ =================
        const workbookDataRaw = [

            { f: "【例文】壁に触らないで。ちょうど塗られたばかりだ。", b: "Don't touch the wall. It has just been painted.", h: "現在完了の受動態 (have been 過去分詞)" }
        ];

        // ================= マスターデータの構築 =================
        const allFlashcards = [];

        // 2章・5章をフォーマット
        chapter25Data.forEach(card => {
            let cat = "問題";
            let fText = `${card.ja}\n\n${card.q}`;
            if (card.q.match(/\([a-zA-Z\s\'\-]+(?:\/[a-zA-Z\s\'\-]+)+\)/) || card.q.includes(' / ')) {
                cat = "並べかえ";

            }
            allFlashcards.push({ lesson: "2_5", category: cat, front: fText, back: card.a, hint: `No. ${card.no}` });

        // Lesson 11-16をフォーマット
        lesson11to16Data.forEach(card => {
            let cat = "文法ポイント";
            let fText = card.front;
            const match = fText.match(/^【(.*?)】(.*)/s);
            if(match) { cat = match[1]; fText = match[2].trim(); }
            
            let l = "all";
            const searchTxt = (card.hint || "") + " " + (card.front || "");
            if (searchTxt.includes("Lesson 11")) l = "11";
            else if (searchTxt.includes("Lesson 12")) l = "12";
            else if (searchTxt.includes("Lesson 13")) l = "13";
            else if (searchTxt.includes("Lesson 14")) l = "14";
            else if (searchTxt.includes("Lesson 15")) l = "15";
            else if (searchTxt.includes("Lesson 16")) l = "16";

            allFlashcards.push({ lesson: l, category: cat, front: fText, back: card.back, hint: card.hint });
        });

        // Workbookをフォーマット
        workbookDataRaw.forEach(card => {
            let cat = "文法ポイント";
            let fText = card.f;
            const match = fText.match(/^【(.*?)】(.*)/s);
            if(match) { cat = match[1]; fText = match[2].trim(); }
            allFlashcards.push({ lesson: "workbook", category: cat, front: fText, back: card.b, hint: card.h });
        });

        // ================= 各種ヘルパー関数 =================

        // 答え文字列をクリーンアップ（[ ]や( / )の削除など）し、裏面の表示用にも使う
        function cleanAnswer(ans) {
            let a = ans.replace(/\[.*?\]/g, ''); 
            if (a.includes('/')) {
                a = a.replace(/\(([^/]+)\s*\/[^)]+\)/g, '$1'); 
            }
            // カッコを削除する際にスペースに置き換えることで、(must)(be) が mustbe になるのを防ぐ
            a = a.replace(/[()]/g, ' '); 
            return a.replace(/\s+/g, ' ').trim();
        }

        // 正規表現用のエスケープ
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // 穴埋め用の正解を「元の文脈（前後の単語）」から引き算して抜き出す関数
        function extractBlankWords(questionEngWithBlank, plainAns) {
            let qParts = questionEngWithBlank.split('()');
            let result = plainAns.replace(/[.,?!]/g, '').trim();
            
            if (qParts.length === 2) {
                let prefix = qParts[0].replace(/[.,?!]/g, '').trim();
                let suffix = qParts[1].replace(/[.,?!]/g, '').trim();
                
                if (prefix) {
                    let regex = new RegExp("^" + escapeRegExp(prefix), "i");
                    if (regex.test(result)) result = result.replace(regex, '').trim();
                    else {
                        let idx = result.toLowerCase().indexOf(prefix.toLowerCase());
                        if (idx !== -1) result = result.substring(idx + prefix.length).trim();
                    }
                }
                
                if (suffix) {
                    let regex = new RegExp(escapeRegExp(suffix) + "$", "i");
                    if (regex.test(result)) result = result.replace(regex, '').trim();
                    else {
                        let idx = result.toLowerCase().lastIndexOf(suffix.toLowerCase());
                        if (idx !== -1) result = result.substring(0, idx).trim();
                    }
                }
                return result.trim();
            }
            return result;
        }

        // 全文用のダミー文生成
        function generateDummySentence(correctText) {
            let dummy = correctText;
            let isCap = /^[A-Z]/.test(dummy);

            const replacements = [
                { from: /\bis\b/, to: 'was' }, { from: /\bwas\b/, to: 'is' },
                { from: /\bare\b/, to: 'were' }, { from: /\bwere\b/, to: 'are' },
                { from: /\bhas been\b/, to: 'is' }, { from: /\bhave been\b/, to: 'are' },
                { from: /\bto\b/, to: 'for' }, { from: /\bfor\b/, to: 'to' },
                { from: /\bwith\b/, to: 'by' }, { from: /\bby\b/, to: 'with' }
            ];

            let replaced = false;
            for (let r of replacements) {
                if (r.from.test(dummy)) {
                    dummy = dummy.replace(r.from, r.to);
                    replaced = true;
                    break;
                }
            }

            if (!replaced && /\bto\s+[a-z]+/.test(dummy)) {
                dummy = dummy.replace(/\bto\s+([a-z]+)/, 'for $1ing');
                replaced = true;
            }
            if (isCap) dummy = dummy.charAt(0).toUpperCase() + dummy.slice(1);
            return dummy;
        }

        // カッコ穴埋め用のダミー語句生成
        function generateDummyWords(correctText) {
            let d = correctText.trim();
            
            if (d === "is") return ["was", "are", "be"][Math.floor(Math.random()*3)];
            if (d === "was") return ["is", "were", "been"][Math.floor(Math.random()*3)];
            if (d === "are") return ["were", "is", "be"][Math.floor(Math.random()*3)];
            if (d === "were") return ["are", "was", "been"][Math.floor(Math.random()*3)];
            if (d === "to") return ["for", "with", "by"][Math.floor(Math.random()*3)];
            if (d === "for") return ["to", "with", "of"][Math.floor(Math.random()*3)];
            if (d === "with") return ["by", "to", "for"][Math.floor(Math.random()*3)];
            if (d === "by") return ["with", "for", "to"][Math.floor(Math.random()*3)];
            if (d === "how to") return "what to";
            if (d === "what to") return "how to";
            
            if (/\bis\b/.test(d)) return d.replace(/\bis\b/g, 'was');
            if (/\bwas\b/.test(d)) return d.replace(/\bwas\b/g, 'is');
            if (/\bare\b/.test(d)) return d.replace(/\bare\b/g, 'were');
            if (/\bwere\b/.test(d)) return d.replace(/\bwere\b/g, 'are');
            if (/\bhas\b/.test(d)) return d.replace(/\bhas\b/g, 'had');
            if (/\bhave\b/.test(d)) return d.replace(/\bhave\b/g, 'had');
            if (/\bto\b/.test(d)) return d.replace(/\bto\b/g, 'for');
            if (/\bfor\b/.test(d)) return d.replace(/\bfor\b/g, 'to');
            if (/\bby\b/.test(d)) return d.replace(/\bby\b/g, 'with');
            if (/\bwith\b/.test(d)) return d.replace(/\bwith\b/g, 'by');

            if (d.includes('ing')) return d.replace('ing', 'ed');
            if (d.includes('ed')) return d.replace('ed', 'ing');
            
            const prefixes = ["to ", "for ", "not to ", "be "];
            return prefixes[Math.floor(Math.random() * prefixes.length)] + d.split(' ')[0];
        }

        // 誤り訂正問題専用のダミー生成
        function generateDummyForCorrection(left, right) {
            let dummies = [];
            if (right === "was") dummies = ["had been", "is being", "to be"];
            else if (right === "married to") dummies = ["married with", "marrying to", "married in"];
            else if (right === "play with") dummies = ["playing", "to play", "play for"];
            else if (right === "to go") dummies = ["going", "go", "gone"];
            else if (right === "how to play") dummies = ["playing", "what to play", "play"];
            else if (right.includes("削除する")) dummies = ["そのまま残す", left + "s にする", "to " + left + " にする"];
            else dummies = [right + "ing", "to " + right, "for " + right];
            return dummies;
        }

        // 重複のないダミー選択肢を複数作成
        function makeUnique(correctText, dummyGenerator, count = 3) {
            let options = new Set();
            let attempts = 0;
            while(options.size < count && attempts < 50) {
                let d = dummyGenerator(correctText);
                let puncMatch = d.match(/([.?!]+)$/);
                let punc = puncMatch ? puncMatch[1] : '';
                let textWithoutPunc = punc ? d.slice(0, -punc.length) : d;

                if (options.has(d) || d === correctText) {
                    const variations = [' simply', ' completely', ' exactly', ' really'];
                    const vary = variations[Math.floor(Math.random() * variations.length)];
                    d = textWithoutPunc + vary + punc;
                }
                
                if (/^[A-Z]/.test(correctText)) {
                    d = d.charAt(0).toUpperCase() + d.slice(1);
                }
                if (d !== correctText) options.add(d);
                attempts++;
            }
            
            while(options.size < count) {
                let puncMatch = correctText.match(/([.?!]+)$/);
                let punc = puncMatch ? puncMatch[1] : '';
                let textWithoutPunc = punc ? correctText.slice(0, -punc.length) : correctText;
                let d = textWithoutPunc + [" exactly", " perfectly", " simply", " quickly"][options.size % 4] + punc;
                if (/^[A-Z]/.test(correctText)) d = d.charAt(0).toUpperCase() + d.slice(1);
                options.add(d);
            }
            return Array.from(options);
        }

        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        // ================= 問題形式の自動変換処理 =================
        function transformToMultipleChoice() {
            let cardIdCounter = 0;
            allFlashcards.forEach(card => {
                card.id = cardIdCounter++;
                let fText = card.front;
                let bText = card.back;
                
                // 答えをクリーンにする（裏面表示用と正解文字列用）
                let cleanAns = cleanAnswer(bText);
                
                // 1. 用法を答える問題 (3択)
                if (fText.includes('用法を答え')) {
                    card.category = "用法問題";
                    card.options = ["名詞的用法", "形容詞的用法", "副詞的用法"];
                    card.correctOption = card.options.find(opt => cleanAns.includes(opt)) || "名詞的用法";
                    card.front = fText + "\n\n<div class='mt-4 flex flex-col gap-2 option-buttons'></div>";
                    card.back = cleanAns;
                    return;
                }

                // 2. 書き換えの正誤問題 (英文4択に)
                if (fText.includes('下の文が正しければ○')) {
                    const parts = fText.split('\n');
                    let originalSentence = parts[1] || "";
                    if (originalSentence.includes('/')) originalSentence = originalSentence.split('/')[0].trim();
                    
                    card.category = "書き換え問題";
                    card.front = "【書き換え】次の文をほぼ同じ意味になるように書き換えたものを選びなさい。\n" + originalSentence + "\n\n<div class='mt-4 flex flex-col gap-2 option-buttons'></div>";
                    
                    let correctOption = cleanAns;
                    if (bText.includes('○')) correctOption = parts[1].split('/')[1].trim(); 
                    else if (fText.includes('They cannot put up with')) correctOption = "His bad attitude cannot be put up with by them.";
                    else if (fText.includes('The big dog')) correctOption = "The children were frightened of the big dog.";
                    else if (fText.includes('They called the old man')) correctOption = "An ambulance was called for the old man.";

                    card.correctOption = correctOption;
                    card.options = shuffleArray([correctOption, ...makeUnique(correctOption, generateDummySentence, 3)]);
                    card.back = correctOption;
                    return;
                }

                // 3. 誤り訂正問題 (該当箇所のみ4択に)
                if (fText.includes('下線部に誤りがあるものを選び')) {
                    card.category = "誤り訂正問題";
                    card.front = fText.replace(/下線部に誤りがあるものを選び、訂正しなさい。?/g, '下線部を最適に直した選択肢を選びなさい。') + "\n\n<div class='mt-4 flex flex-col gap-2 option-buttons'></div>";
                    let correctOpt = bText.split('※')[0].trim();
                    card.correctOption = correctOpt;
                    
                    let parts = correctOpt.split('→');
                    if (parts.length === 2) {
                        let left = parts[0].trim();
                        let right = parts[1].trim();
                        let dummies = generateDummyForCorrection(left, right);
                        
                        card.options = [correctOpt];
                        for(let i=0; i<3; i++) {
                            if(dummies[i]) card.options.push(left + " → " + dummies[i]);
                            else card.options.push(left + " → " + right + "s");
                        }
                    } else {
                        card.options = [correctOpt, "そのまま残す", "toを補う", "ing形にする"];
                    }
                    card.options = shuffleArray(card.options);
                    card.back = correctOpt;
                    return;
                }

                // 4. 穴埋め問題 (カッコや___を検出し、( )に入る語句だけを4択にする)
                let hasBlank = (fText.includes('(') && fText.includes(')')) || fText.includes('___') || fText.includes('_{2,}');
                fText = fText.replace(/\[.*?\]/g, ''); // 選択ヒント削除
                fText = fText.replace(/（/g, '(').replace(/）/g, ')'); // 全角カッコを半角に

                if (hasBlank && !card.category.includes("並べかえ") && !fText.includes("並べかえ") && !fText.includes("並び変え") && !fText.includes("並べかえて")) {
                    card.category = "穴埋め問題";
                    fText = fText.replace(/適切なほうを選びなさい。?/g, '最も適する語を選びなさい。');
                    fText = fText.replace(/入れなさい。?/g, '選びなさい。');
                    fText = fText.replace(/完成させなさい。?/g, '完成させる語句を選びなさい。');
                    
                    let qLines = fText.split('\n');
                    let questionEng = qLines[qLines.length - 1]; // 最後の行が英文
                    
                    // 英語部分のカッコを統合する
                    let formattedEng = questionEng;
                    formattedEng = formattedEng.replace(/_{2,}/g, '()');
                    formattedEng = formattedEng.replace(/\([a-zA-Z\s/']+\)/g, '()'); 
                    formattedEng = formattedEng.replace(/\(\s*\)/g, '()');
                    
                    // 間に単語が挟まっている複数のカッコを完全に1つに統合 (例: () to () -> ())
                    while (formattedEng.match(/\(\)\s*[a-zA-Z,']+\s*\(\)/)) {
                        formattedEng = formattedEng.replace(/\(\)\s*[a-zA-Z,']+\s*\(\)/g, '()');
                    }
                    // 連続する空カッコ ()() を1つにまとめる
                    formattedEng = formattedEng.replace(/(?:\(\)\s*)+/g, '()');

                    // () に入るべき正解フレーズを抽出
                    let correctOpt = extractBlankWords(formattedEng, cleanAns);
                    if (!correctOpt) correctOpt = cleanAns; // 抽出失敗時は全文を答えにする

                    // 質問文の表示を更新
                    qLines[qLines.length - 1] = formattedEng.replace(/\(\)/g, '(        )');
                    let newFrontText = qLines.join('\n');

                    card.correctOption = correctOpt;
                    card.options = shuffleArray([correctOpt, ...makeUnique(correctOpt, generateDummyWords, 3)]);
                    
                    card.front = newFrontText + "\n\n<div class='mt-4 flex flex-col gap-2 option-buttons'></div>";
                    card.back = cleanAns;
                    return;
                }

                // 5. その他の全文4択問題（和訳・例文・英作など。※並べかえ以外）
                if (!card.category.includes("並べかえ") && !fText.includes("並べかえ") && !fText.includes("並び変え") && !fText.includes("並べかえて")) {
                    card.category = "4択問題";
                    let promptText = fText;
                    
                    if (promptText.includes('日本語に直しなさい')) {
                        let qLines = promptText.split('\n');
                        let engSentence = (qLines.length > 1) ? qLines[1].trim() : cleanAns;
                        promptText = "次の日本語と同じ意味の英文を選びなさい。\n" + bText.split('※')[0].trim();
                        cleanAns = engSentence;
                    } else if (promptText.includes('【例文】') || card.category === "例文") {
                        promptText = "次の日本語と同じ意味になる英文を選びなさい。\n" + promptText.replace(/【例文】/g, '').trim();
                    } else if (!promptText.includes('\n')) {
                        promptText = "次の日本語と同じ意味の英文を選びなさい。\n" + promptText;
                    }
                    
                    card.front = promptText + "\n\n<div class='mt-4 flex flex-col gap-2 option-buttons'></div>";
                    card.correctOption = cleanAns;
                    card.options = shuffleArray([cleanAns, ...makeUnique(cleanAns, generateDummySentence, 3)]);
                    card.back = cleanAns;
                    return;
                }

                // 6. 並べかえ問題などは変換不要でそのまま
                card.front = fText;
                card.back = cleanAns;
            });
        }
        transformToMultipleChoice();

        // ================= メニューの定義 =================
        let reviewIds = JSON.parse(localStorage.getItem('grammar_review_ids') || '[]');

        const menuItems = [
            { id: "review", title: "Review", subtitle: "できなかった問題", icon: "fa-star", color: "amber" },
            { id: "11", title: "Lesson 11", subtitle: "受動態①", icon: "fa-1", color: "blue" },
            { id: "12", title: "Lesson 12", subtitle: "受動態②", icon: "fa-2", color: "indigo" },
            { id: "13", title: "Lesson 13", subtitle: "不定詞①", icon: "fa-3", color: "emerald" },
            { id: "14", title: "Lesson 14", subtitle: "不定詞②", icon: "fa-4", color: "teal" },
            { id: "15", title: "Lesson 15", subtitle: "不定詞③", icon: "fa-5", color: "orange" },
            { id: "16", title: "Lesson 16", subtitle: "不定詞④", icon: "fa-6", color: "rose" },
            { id: "11_16_all", title: "Lesson 11-16 総合", subtitle: "受動態・不定詞 全範囲", icon: "fa-layer-group", color: "slate" },
            { id: "workbook", title: "Workbook", subtitle: "例文・練習問題", icon: "fa-book", color: "cyan" },
            { id: "2_5", title: "Insight", subtitle: "2章・5章", icon: "fa-book-open", color: "purple" },
            { id: "all", title: "完全網羅 (全問)", subtitle: "全問題 シャッフル", icon: "fa-globe", color: "rose" }
        ];

        let currentFlashcards = [];
        let currentIndex = 0;
        let isFlipped = false;
        let isAnimating = false;
        let currentLessonId = null;

        const homeView = document.getElementById('home-view');
        const studyView = document.getElementById('study-view');
        const lessonGrid = document.getElementById('lesson-grid');
        const studyTitle = document.getElementById('study-title');
        const backBtn = document.getElementById('back-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const cardContainer = document.getElementById('card-container');
        const cardInner = document.getElementById('card-inner');
        const frontCategory = document.getElementById('front-category');
        const frontText = document.getElementById('front-text');
        const backText = document.getElementById('back-text');
        const hintContainer = document.getElementById('hint-container');
        const hintText = document.getElementById('hint-text');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const starBtn = document.getElementById('star-btn');

        function initHome() {
            lessonGrid.innerHTML = '';
            menuItems.forEach((menu, index) => {
                let count = 0;
                if (menu.id === "review") count = reviewIds.length;
                else if (menu.id === "all") count = allFlashcards.length;
                else if (menu.id === "11_16_all") count = allFlashcards.filter(c => ["11","12","13","14","15","16"].includes(c.lesson)).length;
                else count = allFlashcards.filter(c => c.lesson === menu.id).length;

                const borderColors = { "purple": "border-purple-500", "blue": "border-blue-500", "indigo": "border-indigo-500", "emerald": "border-emerald-500", "teal": "border-teal-500", "amber": "border-amber-500", "orange": "border-orange-500", "slate": "border-slate-700", "rose": "border-rose-500", "cyan": "border-cyan-500" };
                const textColors = { "purple": "text-purple-600", "blue": "text-blue-600", "indigo": "text-indigo-600", "emerald": "text-emerald-600", "teal": "text-teal-600", "amber": "text-amber-600", "orange": "text-orange-600", "slate": "text-slate-700", "rose": "text-rose-600", "cyan": "text-cyan-600" };
                const bgColors = { "purple": "bg-purple-50", "blue": "bg-blue-50", "indigo": "bg-indigo-50", "emerald": "bg-emerald-50", "teal": "bg-teal-50", "amber": "bg-amber-50", "orange": "bg-orange-50", "slate": "bg-slate-100", "rose": "bg-rose-50", "cyan": "bg-cyan-50" };

                const btn = document.createElement('button');
                btn.className = `bg-white rounded-2xl p-6 sm:p-8 shadow-sm hover:shadow-xl transition-all transform hover:-translate-y-1 flex flex-col items-start border-t-4 ${borderColors[menu.color]} w-full text-left group`;
                btn.style.animationDelay = `${index * 0.05}s`;
                btn.classList.add('animate-fade-in');
                
                if (menu.id === "review" && count === 0) {
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                    btn.disabled = true;
                } else {
                    btn.onclick = () => startLesson(menu.id, menu.title);
                }
                
                btn.innerHTML = `
                    <div class="flex justify-between items-center w-full mb-3">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid ${menu.icon} ${textColors[menu.color]} text-lg opacity-70"></i>
                            <span class="${textColors[menu.color]} font-bold text-sm tracking-wider">${menu.title}</span>
                        </div>
                        <div class="h-8 w-8 rounded-full ${bgColors[menu.color]} ${textColors[menu.color]} flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-play text-xs pl-0.5"></i>
                        </div>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-6">${menu.subtitle}</h2>
                    <div class="mt-auto">
                        <span class="text-xs sm:text-sm text-slate-500 bg-slate-50 px-3 py-1.5 rounded-full font-medium border border-slate-100">
                            <i class="fa-solid fa-layer-group mr-1"></i> ${count} Cards
                        </span>
                    </div>
                `;
                lessonGrid.appendChild(btn);
            });
        }

        function startLesson(id, title) {
            currentLessonId = id;
            studyTitle.textContent = title;
            
            if (id === "review") currentFlashcards = allFlashcards.filter(c => reviewIds.includes(c.id));
            else if (id === "all") currentFlashcards = [...allFlashcards];
            else if (id === "11_16_all") currentFlashcards = allFlashcards.filter(c => ["11","12","13","14","15","16"].includes(c.lesson));
            else currentFlashcards = allFlashcards.filter(c => c.lesson === id);
            
            if (["all", "11_16_all", "review"].includes(id)) {
                currentFlashcards = shuffleArray(currentFlashcards);
                shuffleBtn.classList.add('text-indigo-600', 'bg-indigo-100');
            } else {
                shuffleBtn.classList.remove('text-indigo-600', 'bg-indigo-100');
            }

            currentIndex = 0;
            isFlipped = false;
            
            homeView.classList.add('hidden');
            studyView.classList.remove('hidden');
            
            renderCard();
        }

        function renderCard() {
            if (currentFlashcards.length === 0) return;
            const card = currentFlashcards[currentIndex];
            
            let badgeClass = "badge-default";
            if (card.category.includes("和訳")) badgeClass = "badge-wa";
            else if (card.category.includes("穴埋め")) badgeClass = "badge-ana";
            else if (card.category.includes("並べかえ")) badgeClass = "badge-nara";
            else if (card.category.includes("誤り")) badgeClass = "badge-kaki";
            else if (card.options) badgeClass = "badge-4taku";
            
            frontCategory.textContent = card.category;
            frontCategory.className = `category-badge ${badgeClass} w-max mb-0`;
            
            frontText.innerHTML = card.front.replace(/\n/g, '<br>');
            backText.innerHTML = card.back.replace(/\n/g, '<br>');

            if (card.options) {
                const optionContainer = document.querySelector('.option-buttons');
                if (optionContainer) {
                    optionContainer.innerHTML = '';
                    card.options.forEach((opt, idx) => {
                        const btn = document.createElement('button');
                        btn.className = "w-full text-left p-3 border rounded-xl hover:bg-indigo-50 transition-colors text-slate-700 font-medium text-sm sm:text-base mb-2 flex items-start bg-slate-50";
                        btn.innerHTML = `<span class="inline-block w-6 font-bold text-indigo-400 flex-shrink-0">${idx+1}.</span> <span class="break-words">${opt}</span>`;
                        btn.onclick = (e) => {
                            e.stopPropagation();
                            flipCard();
                        };
                        optionContainer.appendChild(btn);
                    });
                }
            }

            if (card.hint && card.hint.trim() !== "") {
                hintContainer.classList.remove('hidden');
                hintText.textContent = card.hint;
            } else {
                hintContainer.classList.add('hidden');
            }

            progressText.textContent = `Card ${currentIndex + 1} of ${currentFlashcards.length}`;
            progressBar.style.width = `${((currentIndex + 1) / currentFlashcards.length) * 100}%`;
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === currentFlashcards.length - 1;

            updateStarBtn(card.id);
        }

        function flipCard() {
            if (isAnimating) return;
            isFlipped = !isFlipped;
            if (isFlipped) cardInner.classList.add('rotate-y-180');
            else cardInner.classList.remove('rotate-y-180');
        }

        function changeCard(newIndex) {
            if (newIndex < 0 || newIndex >= currentFlashcards.length || isAnimating) return;
            isAnimating = true;
            if (isFlipped) {
                isFlipped = false;
                cardInner.classList.remove('rotate-y-180');
                setTimeout(() => {
                    currentIndex = newIndex;
                    renderCard();
                    isAnimating = false;
                }, 300);
            } else {
                currentIndex = newIndex;
                renderCard();
                isAnimating = false;
            }
        }

        // ================= TTS 読み上げ機能 =================
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            let engText = text.replace(/[ぁ-んァ-ヶ亜-熙]/g, '')
                              .replace(/【.*?】/g, '')
                              .replace(/①|②|③|④/g, '')
                              .replace(/1\.|2\.|3\.|4\./g, '')
                              .replace(/\( {2,}\)/g, ' blank ') // 空白カッコをblankと読む
                              .replace(/<[^>]*>?/gm, '')
                              .trim();
            if (!engText) return;
            
            const ut = new SpeechSynthesisUtterance(engText);
            ut.lang = 'en-US';
            window.speechSynthesis.speak(ut);
        }

        document.getElementById('speak-front').addEventListener('click', (e) => {
            e.stopPropagation();
            let textToRead = currentFlashcards[currentIndex].front;
            if (currentFlashcards[currentIndex].options) {
                textToRead += " " + currentFlashcards[currentIndex].options.join(". ");
            }
            speakText(textToRead);
        });

        document.getElementById('speak-back').addEventListener('click', (e) => {
            e.stopPropagation();
            speakText(currentFlashcards[currentIndex].back);
        });

        // ================= 苦手問題(★)登録機能 =================
        function updateStarBtn(id) {
            if (reviewIds.includes(id)) {
                starBtn.classList.replace('bg-slate-100', 'bg-yellow-400');
                starBtn.classList.replace('text-slate-500', 'text-white');
                starBtn.innerHTML = `<i class="fa-solid fa-star"></i> <span>苦手はずす</span>`;
            } else {
                starBtn.classList.replace('bg-yellow-400', 'bg-slate-100');
                starBtn.classList.replace('text-white', 'text-slate-500');
                starBtn.innerHTML = `<i class="fa-regular fa-star"></i> <span>苦手登録</span>`;
            }
        }

        starBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = currentFlashcards[currentIndex].id;
            if (reviewIds.includes(id)) {
                reviewIds = reviewIds.filter(revId => revId !== id);
            } else {
                reviewIds.push(id);
            }
            localStorage.setItem('grammar_review_ids', JSON.stringify(reviewIds));
            updateStarBtn(id);
        });

        // ================= イベントリスナー =================
        cardContainer.addEventListener('click', flipCard);
        prevBtn.addEventListener('click', () => changeCard(currentIndex - 1));
        nextBtn.addEventListener('click', () => changeCard(currentIndex + 1));

        backBtn.addEventListener('click', () => {
            studyView.classList.add('hidden');
            homeView.classList.remove('hidden');
            window.speechSynthesis.cancel();
            initHome();
        });

        shuffleBtn.addEventListener('click', () => {
            if (shuffleBtn.classList.contains('text-indigo-600')) {
                shuffleBtn.classList.remove('text-indigo-600', 'bg-indigo-100');
                if (currentLessonId === "review") currentFlashcards = allFlashcards.filter(c => reviewIds.includes(c.id));
                else if (currentLessonId === "all") currentFlashcards = [...allFlashcards];
                else if (currentLessonId === "11_16_all") currentFlashcards = allFlashcards.filter(c => ["11","12","13","14","15","16"].includes(c.lesson));
                else currentFlashcards = allFlashcards.filter(c => c.lesson === currentLessonId);
            } else {
                shuffleBtn.classList.add('text-indigo-600', 'bg-indigo-100');
                currentFlashcards = shuffleArray(currentFlashcards);
            }
            changeCard(0);
        });

        document.addEventListener('keydown', (e) => {
            if(studyView.classList.contains('hidden')) return;
            if (e.key === 'ArrowRight') changeCard(currentIndex + 1);
            else if (e.key === 'ArrowLeft') changeCard(currentIndex - 1);
            else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault(); 
                flipCard();
            } else if (e.key === 'Escape') backBtn.click();
        });

        let touchStartX = 0, touchEndX = 0;
        cardContainer.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        cardContainer.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) changeCard(currentIndex + 1);
            if (touchEndX > touchStartX + 50) changeCard(currentIndex - 1);
        }, { passive: true });

        // アプリ起動
        initHome();
    </script>
</body>
</html>
